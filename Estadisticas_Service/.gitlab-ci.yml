stages:
  - build
  - image
  - smoke
  - release

variables:
  IMAGEN: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

verificar:
  stage: build
  image: python:3.12-slim
  variables:
    DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
    JWT_SECRET: "clave-solo-para-ci"
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python -m compileall -q app
    - python -c "import app.main"

# Plantilla: Docker dentro del job + login al registry, solo en la rama por defecto
.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publicar-imagen:
  extends: .docker
  stage: image
  script:
    - docker build -t "$IMAGEN" .
    - docker push "$IMAGEN"

prueba-humo:
  extends: .docker
  stage: smoke
  script:
    - docker network create humo
    - docker run -d --name postgres --network humo
        -e POSTGRES_DB=estadisticas -e POSTGRES_USER=campus -e POSTGRES_PASSWORD=campus123
        postgres:16-alpine
    - until docker exec postgres pg_isready -h localhost -U campus -d estadisticas; do sleep 1; done
    - docker run -d --name estadisticas --network humo
        -e DATABASE_URL="postgresql+psycopg://campus:campus123@postgres:5432/estadisticas"
        -e JWT_SECRET="clave-solo-para-la-prueba-de-humo"
        "$IMAGEN"
    - docker run --rm --network humo curlimages/curl:8.10.1
        --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors
        http://estadisticas:8003/health
        || (docker logs estadisticas; exit 1)

promover-latest:
  extends: .docker
  stage: release
  script:
    - docker pull "$IMAGEN"
    - docker tag "$IMAGEN" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"